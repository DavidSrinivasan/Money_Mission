<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up – Money Mission</title>
  <link rel="stylesheet" href="global.css"/>
  <link rel="stylesheet" href="auth.css"/>
</head>
<body>
<div id="money-bg"></div>
<a href="index.html" class="auth-back">← Back to Home</a>

<div class="auth-page">
  <div class="glass auth-card" style="max-width:460px;">
    <div class="auth-logo">
      <div class="logo-icon">💰</div>
      <div class="logo-name">Money<span>Mission</span></div>
    </div>
    <div class="auth-heading">
      <h1 class="auth-title">Create Account 🚀</h1>
      <p class="auth-sub">Start your journey to financial freedom today</p>
    </div>

    <form class="auth-form" id="signupForm" novalidate>
      <div class="form-group">
        <label class="form-label">Full Name</label>
        <div class="input-wrap">
          <input class="form-control" type="text" id="fullName" placeholder="Arjun Sharma" autocomplete="name"/>
          <span class="input-icon">👤</span>
        </div>
        <span class="field-error" id="nameErr">Please enter your full name.</span>
      </div>
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <div class="input-wrap">
          <input class="form-control" type="email" id="email" placeholder="you@example.com" autocomplete="email"/>
          <span class="input-icon">✉️</span>
        </div>
        <span class="field-error" id="emailErr">Please enter a valid email.</span>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="input-wrap">
          <input class="form-control" type="password" id="password" placeholder="At least 8 characters" autocomplete="new-password"/>
          <button type="button" class="input-icon" id="togglePwd">👁️</button>
        </div>
        <div class="pwd-strength-wrap" id="strengthWrap" style="display:none">
          <div class="pwd-strength-bars">
            <div class="pwd-bar" id="bar1"></div>
            <div class="pwd-bar" id="bar2"></div>
            <div class="pwd-bar" id="bar3"></div>
            <div class="pwd-bar" id="bar4"></div>
          </div>
          <span class="pwd-strength-label" id="strengthLabel">Too weak</span>
        </div>
        <span class="field-error" id="pwdErr">Password must be at least 8 characters.</span>
      </div>
      <div class="form-group">
        <label class="form-label">Confirm Password</label>
        <div class="input-wrap">
          <input class="form-control" type="password" id="confirmPwd" placeholder="Repeat your password" autocomplete="new-password"/>
          <button type="button" class="input-icon" id="toggleCnf">👁️</button>
        </div>
        <span class="field-error" id="cnfErr">Passwords do not match.</span>
      </div>
      <label class="remember-wrap" style="font-size:13px;color:var(--text-secondary);">
        <input type="checkbox" id="agree"/>
        <div class="custom-check"></div>
        I agree to the <a href="#" style="color:var(--gold);margin-left:3px;">Terms & Privacy Policy</a>
      </label>
      <span class="field-error" id="agreeErr">You must agree to the terms.</span>
      <button type="submit" class="auth-btn" id="signupBtn">Create My Account</button>
      <div class="auth-redirect">
        Already have an account? <a href="login.html">Sign in →</a>
      </div>
    </form>
  </div>
</div>

<script src="global.js"></script>
<script>
  function guardRoute() {}

  document.getElementById('togglePwd').addEventListener('click', function() {
    var p = document.getElementById('password');
    p.type = p.type === 'text' ? 'password' : 'text';
    this.textContent = p.type === 'text' ? '🙈' : '👁️';
  });
  document.getElementById('toggleCnf').addEventListener('click', function() {
    var p = document.getElementById('confirmPwd');
    p.type = p.type === 'text' ? 'password' : 'text';
    this.textContent = p.type === 'text' ? '🙈' : '👁️';
  });

  document.getElementById('password').addEventListener('input', function() {
    var val = this.value;
    var wrap = document.getElementById('strengthWrap');
    if (!val) { wrap.style.display = 'none'; return; }
    wrap.style.display = 'block';
    var score = 0;
    if (val.length >= 8) score++;
    if (/[A-Z]/.test(val)) score++;
    if (/[0-9]/.test(val)) score++;
    if (/[^a-zA-Z0-9]/.test(val)) score++;
    var bars = [document.getElementById('bar1'),document.getElementById('bar2'),document.getElementById('bar3'),document.getElementById('bar4')];
    var cls  = ['weak','weak','medium','strong'];
    bars.forEach(function(b,i){ b.className = 'pwd-bar' + (i < score ? ' ' + cls[score-1] : ''); });
    var labels = ['Too Weak','Weak','Good','Strong'];
    var colors = ['var(--red)','#f0cc5a','var(--blue)','var(--green)'];
    var lbl = document.getElementById('strengthLabel');
    lbl.textContent = labels[score-1] || 'Too Weak';
    lbl.style.color = colors[score-1] || 'var(--red)';
  });

  document.getElementById('signupForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var nameEl  = document.getElementById('fullName');
    var emailEl = document.getElementById('email');
    var pwdEl   = document.getElementById('password');
    var cnfEl   = document.getElementById('confirmPwd');
    var agreeEl = document.getElementById('agree');
    var ok = true;

    function showErr(id, show) { document.getElementById(id).classList[show ? 'add' : 'remove']('show'); }

    showErr('nameErr',  !nameEl.value.trim() || nameEl.value.trim().length < 2);
    if (!nameEl.value.trim() || nameEl.value.trim().length < 2) ok = false;
    showErr('emailErr', !emailEl.value || emailEl.value.indexOf('@') === -1);
    if (!emailEl.value || emailEl.value.indexOf('@') === -1) ok = false;
    showErr('pwdErr',   !pwdEl.value || pwdEl.value.length < 8);
    if (!pwdEl.value || pwdEl.value.length < 8) ok = false;
    showErr('cnfErr',   pwdEl.value !== cnfEl.value);
    if (pwdEl.value !== cnfEl.value) ok = false;
    showErr('agreeErr', !agreeEl.checked);
    if (!agreeEl.checked) ok = false;
    if (!ok) return;

    var btn = document.getElementById('signupBtn');
    btn.textContent = 'Creating account…';
    btn.disabled = true;

    setTimeout(function() {
      try {
        var user = JSON.stringify({ name: nameEl.value.trim(), email: emailEl.value.trim(), joinedAt: new Date().toISOString() });
        localStorage.setItem('mm_user', user);
      } catch(err) { console.warn('localStorage:', err); }

      // Navigate to dashboard
      var parts = window.location.href.split('/');
      parts[parts.length - 1] = 'dashboard.html';
      window.location.href = parts.join('/');
    }, 800);
  });
</script>
</body>
</html>
