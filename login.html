<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login – Money Mission</title>
  <link rel="stylesheet" href="global.css"/>
  <link rel="stylesheet" href="auth.css"/>
</head>
<body>
<div id="money-bg"></div>
<a href="index.html" class="auth-back">← Back to Home</a>

<div class="auth-page">
  <div class="glass auth-card">
    <div class="auth-logo">
      <div class="logo-icon">💰</div>
      <div class="logo-name">Money<span>Mission</span></div>
    </div>
    <div class="auth-heading">
      <h1 class="auth-title">Welcome Back 👋</h1>
      <p class="auth-sub">Sign in to continue your financial journey</p>
    </div>

    <form class="auth-form" id="loginForm" novalidate>
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <div class="input-wrap">
          <input class="form-control" type="email" id="email" placeholder="you@example.com" autocomplete="email"/>
          <span class="input-icon">✉️</span>
        </div>
        <span class="field-error" id="emailErr">Please enter a valid email.</span>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="input-wrap">
          <input class="form-control" type="password" id="password" placeholder="Enter your password" autocomplete="current-password"/>
          <button type="button" class="input-icon" id="togglePwd">👁️</button>
        </div>
        <span class="field-error" id="pwdErr">Password must be at least 6 characters.</span>
      </div>
      <div class="auth-options">
        <label class="remember-wrap">
          <input type="checkbox" id="remember"/>
          <div class="custom-check"></div>
          Remember me
        </label>
        <a href="#" class="forgot-link">Forgot password?</a>
      </div>
      <button type="submit" class="auth-btn" id="loginBtn">Sign In to Dashboard</button>
      <div class="auth-redirect">
        Don't have an account? <a href="signup.html">Create one free →</a>
      </div>
    </form>

    <div style="margin-top:20px;padding:12px;background:rgba(212,175,55,0.06);border:1px solid rgba(212,175,55,0.15);border-radius:10px;font-size:12px;color:var(--text-secondary);text-align:center;">
      💡 <strong style="color:var(--gold)">Demo:</strong> Use any email + password (min 6 chars) to log in
    </div>

    <div id="errMsg" style="display:none;margin-top:12px;padding:10px;background:rgba(255,90,90,0.1);border:1px solid rgba(255,90,90,0.3);border-radius:8px;font-size:13px;color:#ff5a5a;text-align:center;"></div>
  </div>
</div>

<script src="global.js"></script>
<script>
  // Disable guardRoute on this page
  function guardRoute() {}

  document.getElementById('togglePwd').addEventListener('click', function() {
    var p = document.getElementById('password');
    p.type = p.type === 'text' ? 'password' : 'text';
    this.textContent = p.type === 'text' ? '🙈' : '👁️';
  });

  document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();

    var email = document.getElementById('email').value.trim();
    var pwd   = document.getElementById('password').value;
    var ok    = true;

    document.getElementById('emailErr').classList.remove('show');
    document.getElementById('pwdErr').classList.remove('show');

    if (!email || email.indexOf('@') === -1) {
      document.getElementById('emailErr').classList.add('show');
      ok = false;
    }
    if (!pwd || pwd.length < 6) {
      document.getElementById('pwdErr').classList.add('show');
      ok = false;
    }
    if (!ok) return;

    var btn = document.getElementById('loginBtn');
    btn.textContent = 'Signing in…';
    btn.disabled = true;

    setTimeout(function() {
      // Save user to localStorage
      try {
        var name = email.split('@')[0].replace(/[._]/g, ' ').replace(/\b\w/g, function(c){ return c.toUpperCase(); });
        var user = JSON.stringify({ name: name, email: email, joinedAt: new Date().toISOString() });
        localStorage.setItem('mm_user', user);
      } catch(err) {
        console.warn('localStorage unavailable:', err);
      }

      // Navigate to dashboard - try multiple methods
      try {
        // Method 1: replace current page path with dashboard.html
        var parts = window.location.href.split('/');
        parts[parts.length - 1] = 'dashboard.html';
        window.location.href = parts.join('/');
      } catch(err) {
        // Method 2: direct assign
        window.location.href = 'dashboard.html';
      }
    }, 800);
  });
</script>
</body>
</html>
